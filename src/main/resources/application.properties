spring.application.name=DuelMon

# Activa o soporte automático para RFC 9457 (ProblemDetails) nas excepcións de Spring MVC
spring.mvc.problemdetails.enabled=true

# Activamos ignore case para deserialización en jackson (cuerpos)
spring.jackson.mapper.accept-case-insensitive-enums=true

# Importa el archivo .env local si existe
spring.config.import=optional:file:.env[.properties]

# Conexión con la base de datos -> coge credenciales del .env
spring.datasource.url=jdbc:postgresql://localhost:5432/duelmon_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Datos de pokemon y movimientos -> coge del classpath (resources/data)
duelmon.data.pokemon=classpath:data/pokemon.json
duelmon.data.moves=classpath:data/movimientos.json

duelmon.sprites.base-url=/sprites

# Para que Hibernate cree las tablas en PostgreSQL automáticamente
spring.jpa.hibernate.ddl-auto=update

# Opcional: muestra las consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Opcional: desactiva el patrón Open-Session-In-View
spring.jpa.open-in-view=false

# Tiempo de vida de las solicitudes de amistad (7 días)
duelmon.friends.request-ttl=7d