// Gradle inicialmente lee settings.gradle para determinar qué se va a compilar

// Plugins base y de Spring -> para que Gradle sepa interpretar el proyecto
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Metadatos de identidad
group = 'gal.usc.etse.es'
version = '0.0.1-SNAPSHOT'
description = 'DuelMon'

// Versión de Java
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Repositorio para librerías
repositories {
    mavenCentral()
}

// Dependencias necesarias -> indicando en qué momento del ciclo de vida se necesitan
dependencies {
    // Capa Web REST (incluye Tomcat, Spring MVC y Jackson Databind)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Anotaciones
    implementation 'org.jspecify:jspecify:1.0.0'

    // PODRIAMOS MIRAR DE HACER QUE SE ARRANQUE CON LA APP

    // Spring Data JPA y driver de PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Validación
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}